<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth — Iconic Landmarks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #010408; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- 2D weather overlay: rendered on top of Three.js canvas, behind panel (z-index 200) -->
  <canvas id="weatherCanvas" style="position:fixed;top:0;left:0;z-index:150;pointer-events:none;"></canvas>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    try {

    // ═══════════════════════════════════════════
    //  RENDERER
    // ═══════════════════════════════════════════
    function W() { return window.innerWidth  || document.documentElement.clientWidth  || 800; }
    function H() { return window.innerHeight || document.documentElement.clientHeight || 600; }

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(W(), H());
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ═══════════════════════════════════════════
    //  SCENE / CAMERA
    // ═══════════════════════════════════════════
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010408);
    const camera = new THREE.PerspectiveCamera(40, W() / H(), 0.01, 300);
    camera.position.set(0, 0.5, 5.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 2.2;
    controls.maxDistance = 10;


    // ═══════════════════════════════════════════
    //  LIGHTING
    // ═══════════════════════════════════════════
    scene.add(new THREE.AmbientLight(0x445566, 2.75));

    const key = new THREE.DirectionalLight(0xFFF8E8, 1.75);
    key.position.set(6, 8, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left   = -4; key.shadow.camera.right = 4;
    key.shadow.camera.top    =  4; key.shadow.camera.bottom = -4;
    key.shadow.camera.near   = 0.5; key.shadow.camera.far = 40;
    key.shadow.bias = -0.0003;
    scene.add(key);
    const fillLight = new THREE.DirectionalLight(0x3355AA, 1.1);
    fillLight.position.set(-5, -3, -5);
    scene.add(fillLight);
    const rimLight = new THREE.DirectionalLight(0x224488, 0.7);
    rimLight.position.set(0, -8, -4);
    scene.add(rimLight);

    // ═══════════════════════════════════════════
    //  STARS
    // ═══════════════════════════════════════════
    function rng(seed) {
      let s = seed >>> 0;
      return () => { s ^= s << 13; s ^= s >> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
    }
    {
      const r = rng(77777), verts = [], cols = [];
      for (let i = 0; i < 4000; i++) {
        const th = r() * Math.PI * 2, ph = Math.acos(2 * r() - 1), d = 80 + r() * 60;
        verts.push(d * Math.sin(ph) * Math.cos(th), d * Math.cos(ph), d * Math.sin(ph) * Math.sin(th));
        const b = 0.4 + r() * 0.6;
        const c = r() > 0.85 ? new THREE.Color().setHSL(0.6 + r() * 0.1, 0.6, b) : new THREE.Color(b, b, b);
        cols.push(c.r, c.g, c.b);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      g.setAttribute('color',    new THREE.Float32BufferAttribute(cols,  3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.13, vertexColors: true, sizeAttenuation: true })));
    }

    // ═══════════════════════════════════════════
    //  PROCEDURAL EARTH TEXTURE
    //  (canvas-drawn world map — no external URL)
    // ═══════════════════════════════════════════
    let earthCanvas = null; // saved for land/ocean pixel detection
    function buildEarthTexture() {
      const W = 2048, H = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      // Ocean — rich vivid blue + depth gradient
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0,   '#0E5FAA');
      grad.addColorStop(0.3, '#1A70C0');
      grad.addColorStop(0.7, '#1A70C0');
      grad.addColorStop(1,   '#0E5FAA');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Helper: lat/lon → pixel
      const px = (lon, lat) => [(lon + 180) / 360 * W, (90 - lat) / 180 * H];

      // Land fill + outline for crisp coastlines
      function land(points, fill) {
        ctx.beginPath();
        points.forEach(([lon, lat], i) => {
          const [x, y] = px(lon, lat);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,240,180,0.55)';
        ctx.lineWidth = 3.5;
        ctx.stroke();
      }

      // ── North America ──
      land([[-168,72],[-140,72],[-120,60],[-80,50],[-65,47],[-60,46],[-65,44],[-70,42],[-75,35],[-80,25],[-88,16],[-83,10],[-77,8],[-78,5],[-85,11],[-92,15],[-105,20],[-117,30],[-120,37],[-124,48],[-130,54],[-140,58],[-155,60],[-168,63]], '#3CB828');
      land([[-105,48],[-90,48],[-80,40],[-88,30],[-100,28],[-105,30],[-105,48]], '#90C840'); // Great Plains
      land([[-168,72],[-155,60],[-150,62],[-145,62],[-142,60],[-132,56],[-130,54],[-140,58],[-155,60],[-168,63],[-180,65],[-180,72]], '#3CB828'); // Alaska
      land([[-65,84],[-20,84],[-18,76],[-22,72],[-30,70],[-45,68],[-55,70],[-60,76],[-65,80]], '#C8E0EC'); // Greenland ice

      // ── South America ──
      land([[-80,12],[-77,8],[-78,5],[-73,1],[-60,-5],[-50,-5],[-35,-8],[-35,-15],[-40,-20],[-50,-30],[-55,-35],[-68,-55],[-75,-50],[-75,-40],[-72,-30],[-70,-20],[-75,-10],[-80,0],[-80,8],[-80,12]], '#28A818');
      land([[-78,2],[-72,-2],[-60,-12],[-50,-8],[-48,0],[-58,5],[-70,4],[-78,2]], '#109808'); // Amazon
      land([[-75,-38],[-55,-38],[-58,-55],[-68,-55],[-75,-45]], '#A0B860'); // Patagonia

      // ── Europe ──
      land([[0,51],[2,48],[-5,44],[0,37],[5,36],[12,38],[16,38],[18,40],[16,46],[12,47],[8,48],[0,48],[-5,48],[0,51]], '#58A828');
      land([[-8,44],[-2,44],[3,40],[-2,36],[-8,38],[-8,44]], '#98C840'); // Iberia
      land([[5,58],[8,58],[10,56],[12,56],[18,58],[25,65],[28,70],[20,70],[15,68],[10,62],[5,58]], '#48A020');
      land([[25,65],[30,65],[30,70],[27,70],[25,70],[28,65]], '#48A020');
      land([[16,46],[18,47],[20,48],[22,44],[20,42],[16,42],[16,46]], '#58A828');

      // ── Africa ──
      land([[-5,36],[0,37],[5,36],[12,33],[25,32],[35,30],[42,12],[44,10],[42,4],[40,0],[38,-6],[35,-18],[32,-25],[28,-30],[25,-34],[18,-34],[15,-22],[10,-18],[5,-5],[0,5],[-5,8],[-8,4],[-16,0],[-16,12],[-18,16],[-15,20],[-12,25],[-5,36]], '#50A020');
      land([[-5,36],[42,36],[42,20],[30,15],[20,10],[5,14],[0,18],[-5,20],[-12,25],[-5,36]], '#E0B840'); // Sahara
      land([[10,2],[15,-2],[28,-4],[30,2],[22,6],[10,6],[10,2]], '#109808'); // Congo

      // ── Middle East / Arabia ──
      land([[35,30],[42,30],[56,24],[58,20],[50,12],[44,10],[42,12],[35,22],[35,30]], '#E0B840');

      // ── Russia / Central Asia ──
      land([[30,70],[40,68],[60,68],[80,73],[100,70],[120,72],[140,72],[168,65],[180,65],[180,72],[140,75],[80,78],[60,73],[30,73],[30,70]], '#3A8018');
      land([[30,70],[30,55],[35,48],[40,42],[50,40],[60,42],[75,42],[80,42],[85,50],[90,55],[100,55],[120,50],[130,45],[135,46],[135,48],[130,55],[115,55],[100,60],[80,62],[60,60],[45,58],[35,58],[30,60],[28,65],[30,70]], '#3A8818');
      land([[50,50],[70,50],[85,45],[75,38],[60,38],[50,42],[50,50]], '#B0B858'); // Central Asian steppe
      land([[90,48],[120,50],[115,38],[100,38],[90,40],[90,48]], '#E0B840'); // Gobi Desert

      // ── South Asia ──
      land([[60,22],[70,22],[78,32],[82,28],[88,28],[92,24],[94,20],[80,10],[72,8],[68,24],[60,26],[60,22]], '#48A020');
      land([[65,30],[75,32],[75,26],[68,24],[65,28],[65,30]], '#E0B840'); // Thar desert

      // ── Southeast Asia ──
      land([[92,24],[100,20],[104,2],[110,1],[115,5],[118,8],[120,16],[115,22],[108,22],[100,15],[92,22],[92,24]], '#28A018');
      land([[108,2],[115,3],[117,5],[115,7],[110,6],[108,4],[108,2]], '#18A008'); // Borneo
      land([[95,5],[105,2],[106,-2],[103,-5],[96,-2],[95,3],[95,5]], '#18A008'); // Sumatra
      land([[105,-6],[112,-7],[114,-8],[107,-8],[105,-6]], '#28A018'); // Java

      // ── East Asia ──
      land([[120,50],[130,45],[135,46],[140,42],[140,36],[120,32],[110,22],[104,2],[100,20],[108,22],[115,22],[120,30],[130,35],[135,35],[130,42],[120,48],[115,48],[115,52],[120,50]], '#3A8818');
      land([[130,32],[131,34],[133,36],[136,38],[140,41],[142,44],[142,40],[138,36],[130,32]], '#48A020'); // Japan

      // ── Australia ──
      land([[114,-22],[118,-18],[122,-18],[130,-12],[136,-12],[138,-16],[140,-20],[148,-20],[152,-27],[151,-30],[150,-35],[148,-38],[145,-39],[140,-38],[136,-34],[130,-32],[125,-34],[118,-30],[115,-26],[114,-22]], '#C87030');
      land([[148,-28],[152,-28],[150,-35],[148,-38],[145,-39],[145,-32],[148,-28]], '#58A028'); // SE Australia coast
      land([[170,-36],[174,-38],[172,-42],[168,-44],[168,-42],[172,-38],[170,-36]], '#48A020'); // NZ

      // ── Antarctica ──
      land([[-180,-72],[-140,-72],[-90,-72],[-30,-72],[30,-70],[60,-70],[90,-72],[120,-72],[150,-72],[180,-72],[180,-80],[-180,-80]], '#D8EEF8');

      // River lines on texture
      ctx.strokeStyle = 'rgba(30,130,220,0.7)';
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.lineCap  = 'round';
      // Amazon
      [[[px(-80,0),px(-75,2),px(-68,-2),px(-60,-4),px(-52,-3),px(-48,0)],'river'],
       // Nile
       [[px(33,4),px(32,10),px(31,20),px(31,30),px(32,35)],'river'],
       // Mississippi
       [[px(-90,30),px(-90,35),px(-88,38),px(-90,42),px(-92,45)],'river'],
       // Congo
       [[px(25,-4),px(18,0),px(15,4)],'river'],
       // Yangtze
       [[px(100,28),px(108,30),px(115,32),px(121,31)],'river'],
       // Ob/Irtysh
       [[px(68,68),px(68,60),px(66,54),px(62,50)],'river'],
      ].forEach(([[...pts]])=>{
        ctx.beginPath();
        pts.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y));
        ctx.stroke();
      });

      // Texture noise
      const imgData = ctx.getImageData(0, 0, W, H);
      const d = imgData.data;
      const nr = rng(42);
      for (let i = 0; i < d.length; i += 4) {
        const n = (nr() - 0.5) * 8;
        d[i]   = Math.max(0, Math.min(255, d[i]   + n));
        d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
        d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
      }
      ctx.putImageData(imgData, 0, 0);

      earthCanvas = canvas;
      return new THREE.CanvasTexture(canvas);
    }

    const earthTex = buildEarthTexture();

    // ═══════════════════════════════════════════
    //  GLOBE
    // ═══════════════════════════════════════════
    const globe = new THREE.Group();
    globe.rotation.z = 0.41;
    scene.add(globe);
    const R = 1.5;

    function ll2v(lat, lon, r = R) {
      const phi   = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      return new THREE.Vector3(
        -r * Math.sin(phi) * Math.cos(theta),
         r * Math.cos(phi),
         r * Math.sin(phi) * Math.sin(theta)
      );
    }
    function placeAt(obj, lat, lon, r = R) {
      const pos = ll2v(lat, lon, r);
      obj.position.copy(pos);
      // Align +Y (up direction of building) with the outward radial normal
      const outward = pos.clone().normalize();
      obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), outward);
    }

    // ── Ocean — glossy reflective water ──────
    const ocean = new THREE.Mesh(
      new THREE.SphereGeometry(R - 0.005, 128, 128),
      new THREE.MeshStandardMaterial({
        color: 0x1565C0, roughness: 0.01, metalness: 0.65,
        emissive: new THREE.Color(0.04, 0.18, 0.55), emissiveIntensity: 0.7,
        envMapIntensity: 1.2,
      })
    );
    ocean.receiveShadow = true;
    globe.add(ocean);

    // ── Earth surface ────────────────────────
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(R, 128, 128),
      new THREE.MeshStandardMaterial({
        map: earthTex,
        roughness: 0.88, metalness: 0.0,
        emissive: new THREE.Color(0.01, 0.02, 0.01),
        emissiveIntensity: 0.15,
      })
    );
    earth.receiveShadow = true;
    globe.add(earth);

    // ── Lat/Lon grid ─────────────────────────
    const gridMat = new THREE.LineBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.12, depthWrite: false });
    for (let lat = -80; lat <= 80; lat += 20) {
      const phi = (90 - lat) * Math.PI / 180;
      const pts = [];
      for (let i = 0; i <= 128; i++) {
        const t = (i / 128) * Math.PI * 2, r = R + 0.003;
        pts.push(new THREE.Vector3(-r*Math.sin(phi)*Math.cos(t), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(t)));
      }
      globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
    }
    for (let lon = 0; lon < 360; lon += 20) {
      const t = (lon + 180) * Math.PI / 180;
      const pts = [];
      for (let i = 0; i <= 64; i++) {
        const phi = (i / 64) * Math.PI, r = R + 0.003;
        pts.push(new THREE.Vector3(-r*Math.sin(phi)*Math.cos(t), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(t)));
      }
      globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
    }

    // ── Atmosphere ───────────────────────────
    globe.add(new THREE.Mesh(
      new THREE.SphereGeometry(R + 0.15, 64, 64),
      new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vN, vV;
          void main() {
            vN = normalize(mat3(modelMatrix) * normal);
            vV = normalize(cameraPosition - (modelMatrix * vec4(position,1.0)).xyz);
            gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position,1.0);
          }`,
        fragmentShader: `
          varying vec3 vN, vV;
          void main() {
            float f = pow(1.0 - max(dot(vN,vV),0.0), 3.5);
            gl_FragColor = vec4(0.04 + 0.1*f, 0.3*f, 1.0*f, f * 0.72);
          }`,
        transparent: true, depthWrite: false,
        blending: THREE.AdditiveBlending, side: THREE.FrontSide,
      })
    ));

    // ── Polar ice caps — bright white ────────
    const iceMat = new THREE.MeshStandardMaterial({
      color: 0xD8EEF8, roughness: 0.50, metalness: 0.10,
      emissive: new THREE.Color(0.15, 0.22, 0.30), emissiveIntensity: 0.8,
    });
    [-1, 1].forEach(p => {
      const cap = new THREE.Mesh(new THREE.SphereGeometry(R + 0.004, 48, 12, 0, Math.PI*2, 0, Math.PI*0.12), iceMat);
      if (p === -1) cap.rotation.x = Math.PI;
      globe.add(cap);
    });

    // ── City lights (night side) ─────────────
    {
      const clW = 2048, clH = 1024;
      const clCanvas = document.createElement('canvas');
      clCanvas.width = clW; clCanvas.height = clH;
      const clCtx = clCanvas.getContext('2d');
      clCtx.fillStyle = 'black';
      clCtx.fillRect(0, 0, clW, clH);

      const cities = [
        [-74,41,1.0],[-87,42,0.9],[-118,34,0.9],[-77,39,0.8],[-71,42,0.7],
        [-80,26,0.7],[-122,38,0.8],[-95,30,0.7],[-79,44,0.6],[-0.1,51,0.9],
        [2,49,0.9],[13,52,0.9],[12,41,0.8],[4,52,0.8],[-4,40,0.7],
        [37,55,0.8],[21,52,0.6],[29,41,0.7],[139,35,1.0],[121,31,0.9],
        [116,40,0.9],[114,22,0.8],[103,1,0.8],[77,28,0.8],[72,19,0.8],
        [127,37,0.8],[55,25,0.7],[151,-34,0.7],[-46,-24,0.8],[-43,-23,0.7],
        [-99,19,0.7],[-58,-34,0.6],[31,30,0.6],[3,6,0.5],[28,-26,0.6],
        [36,-1,0.5],[100,14,0.7],[106,-6,0.7],[101,3,0.6]
      ];

      cities.forEach(([lon, lat, br]) => {
        const cx = (lon + 180) / 360 * clW;
        const cy = (90 - lat) / 180 * clH;
        const outerR = 18 * br;
        const grd = clCtx.createRadialGradient(cx, cy, 0, cx, cy, outerR);
        grd.addColorStop(0, `rgba(255,255,180,${br})`);
        grd.addColorStop(1, `rgba(255,200,100,${br * 0.6})`);
        clCtx.beginPath();
        clCtx.arc(cx, cy, outerR, 0, Math.PI * 2);
        clCtx.fillStyle = grd;
        clCtx.fill();
        // Inner bright spot
        const grd2 = clCtx.createRadialGradient(cx, cy, 0, cx, cy, 4);
        grd2.addColorStop(0, `rgba(255,255,180,${br})`);
        grd2.addColorStop(1, 'rgba(255,255,180,0)');
        clCtx.beginPath();
        clCtx.arc(cx, cy, 4, 0, Math.PI * 2);
        clCtx.fillStyle = grd2;
        clCtx.fill();
      });

      const cityTex = new THREE.CanvasTexture(clCanvas);
      const sunDirN = new THREE.Vector3(6, 8, 4).normalize();
      const cityMat = new THREE.ShaderMaterial({
        uniforms: {
          cityMap: { value: cityTex },
          sunDir:  { value: sunDirN }
        },
        vertexShader: `
          varying vec2 vUv; varying vec3 vWorldNormal;
          void main() {
            vUv = uv;
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position,1.0);
          }`,
        fragmentShader: `
          uniform sampler2D cityMap; uniform vec3 sunDir;
          varying vec2 vUv; varying vec3 vWorldNormal;
          void main() {
            float night = clamp(-dot(vWorldNormal, sunDir)*3.0, 0.0, 1.0);
            vec4 c = texture2D(cityMap, vUv);
            gl_FragColor = vec4(c.rgb * night, c.r * night);
          }`,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.FrontSide,
      });
      const cityMesh = new THREE.Mesh(new THREE.SphereGeometry(R - 0.001, 128, 64), cityMat);
      globe.add(cityMesh);
    }

    // ── Animated clouds ───────────────────────
    let clouds;
    {
      const ccW = 2048, ccH = 1024;
      const ccCanvas = document.createElement('canvas');
      ccCanvas.width = ccW; ccCanvas.height = ccH;
      const ccCtx = ccCanvas.getContext('2d');
      ccCtx.clearRect(0, 0, ccW, ccH);

      const cr2 = rng(11111);
      for (let i = 0; i < 100; i++) {
        const cx = cr2() * ccW;
        const cy = cr2() * ccH;
        const radius = 30 + cr2() * 80;
        const alpha = 0.25 + cr2() * 0.30;
        const scaleX = 1.5 + cr2() * 2.0;

        ccCtx.save();
        ccCtx.translate(cx, cy);
        ccCtx.scale(scaleX, 1);
        const grd = ccCtx.createRadialGradient(0, 0, 0, 0, 0, radius);
        grd.addColorStop(0, `rgba(255,255,255,${alpha})`);
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        ccCtx.beginPath();
        ccCtx.arc(0, 0, radius, 0, Math.PI * 2);
        ccCtx.fillStyle = grd;
        ccCtx.fill();
        ccCtx.restore();
      }

      const cloudTex = new THREE.CanvasTexture(ccCanvas);
      clouds = new THREE.Mesh(
        new THREE.SphereGeometry(R + 0.025, 128, 64),
        new THREE.MeshStandardMaterial({
          map: cloudTex,
          transparent: true, opacity: 0.72,
          depthWrite: false,
          roughness: 0.9, metalness: 0.0,
          emissive: new THREE.Color(1, 1, 1), emissiveIntensity: 0.05,
        })
      );
      globe.add(clouds);
    }

    // ── Aurora Borealis ───────────────────────
    let auroraMat;
    {
      auroraMat = new THREE.ShaderMaterial({
        uniforms: { time: { value: 0.0 } },
        vertexShader: `
          varying vec3 vNorm; varying vec2 vUv;
          void main() {
            vNorm = normalize(mat3(modelMatrix) * normal);
            vUv = uv;
            gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position,1.0);
          }`,
        fragmentShader: `
          uniform float time; varying vec3 vNorm; varying vec2 vUv;
          float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
          float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
          void main(){
            float lat=abs(vNorm.y);
            float zone=smoothstep(0.58,0.80,lat);
            if(zone<0.01)discard;
            float lon=atan(vNorm.z,vNorm.x);
            float w=n(vec2(lon*5.0+time*0.35,time*0.18))*0.7+n(vec2(lon*12.0+time*0.6,time*0.3))*0.3;
            float curtain=zone*(0.3+w*0.7);
            vec3 green=vec3(0.0,0.95,0.45);
            vec3 blue=vec3(0.15,0.55,1.0);
            vec3 col=mix(green,blue,w);
            gl_FragColor=vec4(col,curtain*0.55);
          }`,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
      });
      const auroraMesh = new THREE.Mesh(new THREE.SphereGeometry(R + 0.10, 64, 32), auroraMat);

    // — Eiffel Tower — wrought-iron #7A6840, curved TubeGeometry legs
    function buildEiffel() {
      const g=new THREE.Group(), m=realMat(0x7A6840,0.72,0.12);
      const FOOT=0.042, H1=0.062, H2=0.104, HTOP=0.198;
      for(let i=0;i<4;i++){
        const a=(i/4)*Math.PI*2+Math.PI/4;
        const fx=Math.cos(a)*FOOT, fz=Math.sin(a)*FOOT;
        const curve=new THREE.CatmullRomCurve3([
          new THREE.Vector3(fx,0.001,fz),
          new THREE.Vector3(fx*0.55,H1*0.45,fz*0.55),
          new THREE.Vector3(Math.cos(a)*0.007,H1,Math.sin(a)*0.007),
        ]);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,8,0.0028,5),m));
      }
      [H1,H2].forEach((y,i)=>{
        const r=i===0?0.011:0.007;
        const ring=new THREE.Mesh(new THREE.TorusGeometry(r,0.0012,4,18),m);
        ring.position.y=y; ring.rotation.x=Math.PI/2; g.add(ring);
      });
      const s1=new THREE.Mesh(new THREE.CylinderGeometry(0.0055,0.009,H2-H1,8),m); s1.position.set(0,H1+(H2-H1)/2,0); g.add(s1);
      const s2=new THREE.Mesh(new THREE.CylinderGeometry(0.0016,0.0055,HTOP-H2,8),m); s2.position.set(0,H2+(HTOP-H2)/2,0); g.add(s2);
      const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.0003,0.001,0.032,5),m); ant.position.set(0,HTOP+0.016,0); g.add(ant);
      return g;
    }

    // — Burj Khalifa — high-reflectance glass + aluminium
    function buildBurj() {
      const g=new THREE.Group();
      const gl=glassMat(0x7AAABB), al=realMat(0xC8D8E0,0.28,0.92);
      const HTOT=0.270;
      // Three Y-shaped wings, each tapering and stepping back
      for(let i=0;i<3;i++){
        const a=i*(Math.PI*2/3);
        const cx=Math.cos(a)*0.010, cz=Math.sin(a)*0.010;
        // Wing sections — 4 setbacks each narrowing
        [[0,HTOT*0.32,0.0130,0.0110],[HTOT*0.32,HTOT*0.56,0.0110,0.0086],
         [HTOT*0.56,HTOT*0.74,0.0086,0.0062],[HTOT*0.74,HTOT*0.88,0.0062,0.0040]
        ].forEach(([y0,y1,w0,w1],si)=>{
          const sh=y1-y0;
          const box=new THREE.Mesh(new THREE.BoxGeometry(w0*(1-si*0.05),sh,w0*(0.85-si*0.05)),gl);
          box.position.set(cx*(1-si*0.18),(y0+y1)/2,cz*(1-si*0.18));
          box.rotation.y=a; g.add(box);
          // Floor bands
          for(let fy=y0; fy<y1; fy+=HTOT*0.022){
            const fb=new THREE.Mesh(new THREE.BoxGeometry(w0*(1-si*0.05)+0.001,0.0006,w0*(0.85-si*0.05)+0.001),al);
            fb.position.set(cx*(1-si*0.18),fy,cz*(1-si*0.18)); fb.rotation.y=a; g.add(fb);
          }
        });
      }
      // Central spire
      [[0,HTOT*0.88,0.0055,0.0030],[HTOT*0.88,HTOT,0.0030,0.0006]].forEach(([y0,y1,r0,r1])=>{
        const cyl=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,y1-y0,12),al);
        cyl.position.y=(y0+y1)/2; g.add(cyl);
      });
      const tip=new THREE.Mesh(new THREE.CylinderGeometry(0.0002,0.0006,0.048,6),al);
      tip.position.y=HTOT+0.024; g.add(tip);
      return g;
    }

    // — Colosseum — travertine limestone #C0A070, elliptical ExtrudeGeometry tiers
    function buildColosseum() {

    function buildTokyo() {

      const FOOT=0.038, H1=0.056, HTOP=0.178;

        const a=(i/4)*Math.PI*2+Math.PI/4;
        const fx=Math.cos(a)*FOOT, fz=Math.sin(a)*FOOT;
        const curve=new THREE.CatmullRomCurve3([
          new THREE.Vector3(fx,0.001,fz),
          new THREE.Vector3(fx*0.55,H1*0.4,fz*0.55),
          new THREE.Vector3(Math.cos(a)*0.006,H1,Math.sin(a)*0.006),
        ]);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,8,0.0025,5),red));
      }
      const deck=new THREE.Mesh(new THREE.TorusGeometry(0.009,0.0018,5,20),white); deck.position.y=H1; deck.rotation.x=Math.PI/2; g.add(deck);
      const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.0014,0.005,HTOP-H1,6),red); mast.position.set(0,H1+(HTOP-H1)/2,0); g.add(mast);
      [0.30,0.55,0.75].forEach(t=>{const y=H1+t*(HTOP-H1);const band=new THREE.Mesh(new THREE.TorusGeometry(0.002,0.0008,4,14),white);band.position.y=y;band.rotation.x=Math.PI/2;g.add(band);});
      const needle=new THREE.Mesh(new THREE.CylinderGeometry(0.0003,0.001,0.026,5),white); needle.position.set(0,HTOP+0.013,0); g.add(needle);

    //  PLACE LANDMARKS
    // ═══════════════════════════════════════════
    function makeLabel(text, col) {
      const c = document.createElement('canvas'); c.width = 640; c.height = 96;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 640, 96);
      const hexStr = '#' + col.toString(16).padStart(6,'0');
      ctx.font = 'bold 30px system-ui, sans-serif';
      const measured = ctx.measureText(text).width;
      const pad = 22, bw = measured + pad*2, bh = 54;
      const bx = (640 - bw) / 2, by = (96 - bh) / 2;
      // Solid pill background
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 12);
      ctx.fillStyle = 'rgba(4,10,22,0.88)';
      ctx.fill();
      ctx.strokeStyle = hexStr; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
      ctx.stroke();
      ctx.globalAlpha = 1;
      // White text with colored glow
      ctx.font = 'bold 30px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = hexStr; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, 320, 48);
      const tex = new THREE.CanvasTexture(c);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false, sizeAttenuation: true }));
      sp.renderOrder = 20;
      sp.scale.set(0.90, 0.135, 1);
      return sp;
    }

    // — KLCC Petronas Twin Towers — Malaysia #3.16°N, 101.71°E
    function buildKLCC() {
      const g = new THREE.Group();
      // KLCC uses stainless steel cladding + tinted glass curtain wall
      const gl  = glassMat(0x6FA8C0);           // tinted glass curtain wall
      const ss  = realMat(0xB8C8D2, 0.22, 0.88); // brushed stainless steel
      const conc= realMat(0xB0A898, 0.72, 0.04); // concrete podium
      const HTOT = 0.340;  // total height including spire
      const SEP  = 0.0175; // half-separation between tower axes

      // Each tower: 16-sided cylinders (star cross-section approximated)
      // Sections: base → main shaft → upper taper → crown → spire
      function buildTower(ox) {
        const tw = new THREE.Group();
        const SEGS = 16; // 16-sided = near-circular but faceted
        const ROT  = Math.PI / 16;

        // Section layout: [yBot, yTop, rBot, rTop, mat]
        const sections = [
          [0,           HTOT*0.03,  0.0175, 0.0175, conc], // podium base ring
          [HTOT*0.03,   HTOT*0.52,  0.0162, 0.0148, gl  ], // main lower shaft
          [HTOT*0.52,   HTOT*0.72,  0.0148, 0.0120, gl  ], // first setback
          [HTOT*0.72,   HTOT*0.84,  0.0120, 0.0088, gl  ], // second setback
          [HTOT*0.84,   HTOT*0.89,  0.0088, 0.0060, ss  ], // transition neck
          [HTOT*0.89,   HTOT*0.92,  0.0080, 0.0055, ss  ], // crown ring step
        ];
        sections.forEach(([y0,y1,r0,r1,mat])=>{
          const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,y1-y0,SEGS),mat);
          cyl.rotation.y = ROT;
          cyl.position.set(ox, (y0+y1)/2, 0);
          tw.add(cyl);
        });

        // Horizontal floor ring bands every ~3 floors
        const ringMat = realMat(0xD8E4EB, 0.28, 0.78);
        const FLOOR_STEP = HTOT * 0.022;
        for (let y = HTOT*0.03; y < HTOT*0.89; y += FLOOR_STEP) {
          const frac = (y - HTOT*0.03) / (HTOT*0.86);
          const r = 0.0168 - frac * 0.0108; // interpolate radius
          const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.00048, 3, 16), ringMat);
          ring.rotation.x = Math.PI / 2;
          ring.position.set(ox, y, 0);
          tw.add(ring);
        }

        // Crown: stepped rings at top
        [[HTOT*0.89, 0.0065, 0.00065],[HTOT*0.905, 0.0055, 0.00055],
         [HTOT*0.92,  0.0040, 0.00045]].forEach(([y,r,t])=>{
          const cr = new THREE.Mesh(new THREE.TorusGeometry(r,t,3,16),ss);
          cr.rotation.x = Math.PI/2; cr.position.set(ox,y,0); tw.add(cr);
        });

        // Spire: two-part (thick base + slender tip)
        const sp1 = new THREE.Mesh(new THREE.CylinderGeometry(0.0018,0.0032,HTOT*0.048,8),ss);
        sp1.position.set(ox, HTOT*0.92+HTOT*0.024, 0); tw.add(sp1);
        const sp2 = new THREE.Mesh(new THREE.CylinderGeometry(0.0003,0.0018,HTOT*0.060,6),ss);
        sp2.position.set(ox, HTOT*0.92+HTOT*0.048+HTOT*0.030, 0); tw.add(sp2);
        // Spire tip ball
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.0010,6,4),ss);
        ball.position.set(ox, HTOT*0.92+HTOT*0.048+HTOT*0.060+0.001, 0); tw.add(ball);

        g.add(tw);
      }

      buildTower(-SEP);
      buildTower( SEP);

      // Sky bridge (floors 41–42, ~46% of main shaft height)
      const bridgeY = HTOT * 0.44;
      const bridgeSpan = SEP * 2 + 0.003;
      const bridgeMesh = new THREE.Mesh(
        new THREE.BoxGeometry(bridgeSpan, 0.0055, 0.0085), ss);
      bridgeMesh.position.set(0, bridgeY, 0); g.add(bridgeMesh);
      // Bridge support struts (V-shaped props)
      [-1,1].forEach(side=>{
        const strutX = side * (SEP - 0.002);
        const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.0010,0.0015,0.018,5),ss);
        strut.position.set(strutX, bridgeY - 0.009, 0);
        strut.rotation.z = side * 0.3;
        g.add(strut);
      });

      return g;
    }

    // Spin globe so that the lat/lon faces the camera (+Z direction)
    function spinGlobeToCountry(lat, lon) {
      const theta = (lon + 180) * Math.PI / 180;
      // Target globe.rotation.y so the country faces +Z (camera direction)
      const targetY = Math.PI / 2 - theta;
      // Shortest angular path from current rotation
      let cur = globe.rotation.y;
      let diff = ((targetY - cur) % (Math.PI*2) + Math.PI*3) % (Math.PI*2) - Math.PI;
      globeSpinTween = { startY: cur, endY: cur + diff, t: 0, dur: 65 };
    }

    // ── Parachutist system ────────────────────────
    function makeParachutist() {
      const g = new THREE.Group();
      // Canopy — 8 alternating panels (red/white)
      const nP = 8;
      for (let i = 0; i < nP; i++) {
        const panMat = new THREE.MeshStandardMaterial({
          color: i%2===0 ? 0xFF4422 : 0xFFFFFF, roughness:0.85, metalness:0.0, side:THREE.DoubleSide
        });
        const pGeo = new THREE.SphereGeometry(0.028, 4, 8, i*Math.PI*2/nP, Math.PI*2/nP, 0, Math.PI*0.52);
        const panel = new THREE.Mesh(pGeo, panMat);
        panel.rotation.x = Math.PI; // open side down
        g.add(panel);
      }
      // Suspension lines
      const lv = [];
      for (let i = 0; i < nP; i++) {
        const a = i*Math.PI*2/nP;
        lv.push(Math.cos(a)*0.022, -0.001, Math.sin(a)*0.022, 0, -0.048, 0);
      }
      g.add(new THREE.LineSegments(
        new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(lv,3)),
        new THREE.LineBasicMaterial({color:0xCCCCCC})
      ));
      // Human
      const bodyMat = new THREE.MeshStandardMaterial({color:0x1133BB, roughness:0.85, metalness:0.0});
      const skinMat = new THREE.MeshStandardMaterial({color:0xFFBB88, roughness:0.85, metalness:0.0});
      const helmMat = new THREE.MeshStandardMaterial({color:0xFF8800, roughness:0.6, metalness:0.1});
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.0058,0.018,3,8), bodyMat);
      torso.position.y = -0.060; g.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.0068,8,6), skinMat);
      head.position.y = -0.043; g.add(head);
      const helm = new THREE.Mesh(new THREE.SphereGeometry(0.0076,8,5,0,Math.PI*2,0,Math.PI*0.58), helmMat);
      helm.position.y = -0.042; g.add(helm);
      [-1,1].forEach(s => {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.0024,0.016,3,5), bodyMat);
        arm.rotation.z = s*1.15; arm.position.set(s*0.012,-0.063,0); g.add(arm);
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.0026,0.019,3,5), bodyMat);
        leg.rotation.z = s*0.18; leg.position.set(s*0.004,-0.079,0); g.add(leg);
      });
      return g;
    }

      const eySp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(ec),transparent:true,depthWrite:false}));
      eySp.scale.set(0.013,0.006,1); eySp.position.set(0,0.0015,0.0205); g.add(eySp);
      // Arms spread (X shape)
      [-1,1].forEach(s=>{
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.0024,0.020,3,5), bodyMat);
        arm.rotation.z = Math.PI/2; arm.position.set(s*0.016,0,0.010); g.add(arm);
      });
      // Legs spread
      [-1,1].forEach(s=>{
        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.0026,0.022,3,5), bodyMat);
        leg.rotation.x = Math.PI/2; leg.rotation.z = s*0.4;
        leg.position.set(s*0.009,0,-0.016); g.add(leg);
      });
      // Deflated parachute crumpled nearby — flat squished dome panels
      const cMat0 = new THREE.MeshStandardMaterial({color:0xFF4422,roughness:0.9,side:THREE.DoubleSide});
      const cMat1 = new THREE.MeshStandardMaterial({color:0xFFFFFF,roughness:0.9,side:THREE.DoubleSide});
      for(let i=0;i<8;i++){
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.020,3,3,i*Math.PI*2/8,Math.PI*2/8,0,Math.PI*0.35), i%2===0?cMat0:cMat1);
        p.scale.y = 0.08; p.position.set(-0.018+Math.cos(i)*0.003,0.0003,-0.012+Math.sin(i)*0.003);
        g.add(p);
      }
      // Skull emoji floating above
      const sc2 = document.createElement('canvas'); sc2.width=64; sc2.height=64;
      const sc2x = sc2.getContext('2d');
      sc2x.font='52px serif'; sc2x.textAlign='center'; sc2x.textBaseline='middle';
      sc2x.fillText('💀',32,34);
      const skSp = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(sc2),transparent:true,depthWrite:false}));
      skSp.scale.set(0.045,0.045,1); skSp.position.set(0,0.048,0.020); g.add(skSp);
      return g;
    }

    function launchParachutist(lat, lon, type) {
      // Remove any existing parachutist
      if (parachuteState) { globe.remove(parachuteState.mesh); parachuteState = null; }
      const mesh = makeParachutist();
      mesh.scale.setScalar(3.5);
      const startPos = ll2v(lat, lon, R + 2.2);
      const endPos   = ll2v(lat, lon, R + 0.018);
      const normal   = endPos.clone().normalize();
      mesh.position.copy(startPos);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), normal);
      globe.add(mesh);
      parachuteState = { mesh, startPos, endPos, normal, startTime:Date.now(), duration:3200, type, phase:'falling', deathStart:0, followCam:false };
    }

    // ── Weather / celebration animation — 2D canvas overlay ──────────────────────
    let weatherAnim = null;

    function stopWeather() {
      if (!weatherAnim) return;
      weatherAnim = null;
      const wc = document.getElementById('weatherCanvas');
      if (wc) wc.getContext('2d').clearRect(0, 0, wc.width, wc.height);
    }

    function startMoneyRain(lat, lon) {
      stopWeather();
      const N = 40;
      const sw = W(), sh = H();
      const particles = [];
      for (let i = 0; i < N; i++) {
        const x = Math.random() * sw;
        const y = -80 - Math.random() * 300;
        particles.push({
          x, y, y_reset: y,
          vx: (Math.random() - 0.5) * 1.2,
          vy: 2.0 + Math.random() * 2.5,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.09,
          w: 56 + Math.random() * 24, h: 34 + Math.random() * 14,
          phase: Math.random() * Math.PI * 2,
          swayAmp: 0.8 + Math.random() * 2.0,
        });
      }
      weatherAnim = { type:'money', particles, lat, lon, startTime:Date.now(), duration:7000 };
    }

    function startRain(lat, lon) {
      stopWeather();
      const N = 130;
      const sw = W(), sh = H();
      const particles = [];
      for (let i = 0; i < N; i++) {
        const x = Math.random() * sw;
        const y = -30 - Math.random() * sh;
        particles.push({
          x, y, y_reset: y,
          vy: 5 + Math.random() * 7,
          len: 12 + Math.random() * 24,
        });
      }
      weatherAnim = { type:'rain', particles, lat, lon, startTime:Date.now(), duration:7000 };
    }

    const markerData = []; // populated after animate() is first called
    const shootingStars = [];
    let tick = 0;
    function animate() {
      requestAnimationFrame(animate);
      tick += 0.016;
      if (!globeRotPaused) globe.rotation.y += 0.0014;

      // Globe spin tween — rotate to face clicked country
      if (globeSpinTween) {
        globeSpinTween.t++;
        const p = Math.min(1, globeSpinTween.t / globeSpinTween.dur);
        const ease = 1 - Math.pow(1 - p, 4); // easeOutQuart
        globe.rotation.y = globeSpinTween.startY + (globeSpinTween.endY - globeSpinTween.startY) * ease;
        if (globeSpinTween.t >= globeSpinTween.dur) {
          const cb = globeSpinTween.onComplete;
          globeSpinTween = null;
          if (cb) cb();
        }
      }

      // Pulse calc country border
      if (calcBorderLine) {
        const pulse = 0.5 + 0.5 * Math.sin(tick * 3);
        calcBorderLine.userData.lineMat.opacity = 0.6 + 0.4 * pulse;
        calcBorderLine.userData.glowMat.opacity = 0.15 + 0.25 * pulse;
        calcBorderLine.userData.fillMat.opacity = 0.08 + 0.14 * pulse;
      }

      // Pulse home country highlight + building glow
      if (homeHighlight) {
        const hp  = 0.5 + 0.5 * Math.sin(tick * 4);
        const hp2 = 0.5 + 0.5 * Math.sin(tick * 4 + 1.5);
        homeHighlight.userData.r1.opacity      = 0.8 + 0.2  * hp;
        homeHighlight.userData.r2.opacity      = 0.35 + 0.4 * hp;
        homeHighlight.userData.r3.opacity      = 0.08 + 0.38 * hp2;
        homeHighlight.userData.beamMat.opacity = 0.35 + 0.45 * hp;
        homeHighlight.userData.ring3mesh.scale.setScalar(1 + 0.45 * hp2);
        // Pulse building glow emissive intensity
        if (homeHighlight.userData.homeBldgMats) {
          const gp = 0.6 + 0.4 * Math.sin(tick * 3.5);
          homeHighlight.userData.homeBldgMats.forEach(({ glow }) => {
            glow.emissiveIntensity = 0.8 + 1.0 * gp;
          });
        }
      }

      // Animate plane along arc
      if (flightDot && flightArcPts.length > 1) {
        flightArcT = (flightArcT + 0.004) % 1;
        const raw = flightArcT * (flightArcPts.length - 1);
        const i0  = Math.floor(raw);
        const i1  = Math.min(i0 + 1, flightArcPts.length - 1);
        flightDot.position.lerpVectors(flightArcPts[i0], flightArcPts[i1], raw - i0);
      }

      // Camera zoom tween — easeOutExpo for cinematic feel
      if (zoomTween) {
        zoomTween.t++;
        const p = Math.min(1, zoomTween.t / zoomTween.dur);
        const ease = p === 1 ? 1 : 1 - Math.pow(2, -10 * p); // easeOutExpo
        camera.position.lerpVectors(zoomTween.startPos, zoomTween.endPos, ease);
        camera.lookAt(0, 0, 0);
        if (zoomTween.t >= zoomTween.dur) {
          zoomTween = null;
          if (!(parachuteState && parachuteState.followCam)) {
            // Sync OrbitControls internal state to the new camera position
            // before re-enabling so it doesn't snap back
            controls.enabled = true;
            controls.target.set(0, 0, 0);
            controls.minDistance = 2.2;
            controls.maxDistance = 10;
            // Force internal spherical recalc from current camera position
            controls.enabled = false;
            controls.enabled = true;
          }
        }
      }

      // Ocean gentle pulse (light refraction shimmer)
      ocean.material.emissiveIntensity = 0.62 + Math.sin(tick * 0.7) * 0.10 + Math.sin(tick * 1.3) * 0.06;


      // Animate marine creatures along orbital paths
      marineList.forEach(c => {
        c.angle += c.speed;
        // Position
        const pos = new THREE.Vector3()
          .addScaledVector(c.u, Math.cos(c.angle) * c.r)
          .addScaledVector(c.v, Math.sin(c.angle) * c.r);
        // Tangent (swimming direction)
        _mFwd.set(0,0,0)
          .addScaledVector(c.u, -Math.sin(c.angle))
          .addScaledVector(c.v,  Math.cos(c.angle))
          .normalize();
        // Surface normal
        _mUp.copy(pos).normalize();
        // Right
        _mRt.crossVectors(_mUp, _mFwd).normalize();
        // Reorthogonalize forward
        _mFwd.crossVectors(_mRt, _mUp).normalize();
        // Build orientation matrix: X=forward, Y=up(outward), Z=right
        _mM4.makeBasis(_mFwd, _mUp, _mRt);
        c.mesh.quaternion.setFromRotationMatrix(_mM4);
        c.mesh.position.copy(pos);

        // Whale: realistic swimming — tail flap, surfacing, body roll + pitch
        if (c.mesh.userData.tailGroup) {
          c.mesh.userData.swimPhase += 0.065;
          const sp = c.mesh.userData.swimPhase;

          // Tail flukes flap up/down — strong power stroke
          c.mesh.userData.tailGroup.rotation.z = Math.sin(sp) * 0.45;

          // Periodic surfacing: whale rises to breathe every ~100 frames
          // surfacePhase cycles slowly; when near 0 the whale is at surface
          const surfaceWave = Math.sin(sp * 0.18);
          c.r = c.baseR + Math.max(0, surfaceWave) * 0.022;

          // Body pitch: nose tilts up on ascent, down on dive
          const pitchAmt = surfaceWave * 0.18 + Math.sin(sp * 0.5) * 0.07;
          _pitchQ.setFromAxisAngle(_pitchAxis, pitchAmt);
          c.mesh.quaternion.multiply(_pitchQ);

          // Gentle body roll (side-to-side) as whale swims — subtle banking
          const rollAxis = new THREE.Vector3(1, 0, 0); // forward axis = roll
          const rollQ = new THREE.Quaternion().setFromAxisAngle(rollAxis, Math.sin(sp * 0.35 + 0.8) * 0.12);
          c.mesh.quaternion.multiply(rollQ);
        }

        // Dolphin pod: animate individual breach jumps
        if (c.mesh.userData.isPod) {
          c.mesh.children.forEach(child => {
            child.userData.breachPhase += 0.048;
            const breach = Math.max(0, Math.sin(child.userData.breachPhase)) * 0.022;
            child.position.y = child.userData.baseY + breach;
          });
        }
      });

      // Polar bears — walk in circles on ice
      bearList.forEach(b => {
        b.lon += b.speed;
        const pos = ll2v(b.lat, b.lon * 180 / Math.PI, R + 0.009);
        b.mesh.position.copy(pos);
        // Face direction of travel (eastward)
        const next = ll2v(b.lat, (b.lon + b.speed * 8) * 180 / Math.PI, R + 0.009);
        const fwd = next.clone().sub(pos).normalize();
        const up = pos.clone().normalize();
        const rt = new THREE.Vector3().crossVectors(up, fwd).normalize();
        fwd.crossVectors(rt, up).normalize();
        b.mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fwd, up, rt));
      });

      // Pulse country markers
      markerData.forEach(m => {
        m.t += 0.045;
        // Inner ring: scale out and fade
        const p1 = (Math.sin(m.t) * 0.5 + 0.5);
        m.ring.scale.setScalar(1 + p1 * 2.2);
        m.ringMat.opacity = 0.85 * (1 - p1 * 0.85);
        // Outer ring: offset phase
        const p2 = (Math.sin(m.t - 1.2) * 0.5 + 0.5);
        m.ring2.scale.setScalar(1 + p2 * 3.5);
        m.ring2Mat.opacity = 0.5 * (1 - p2 * 0.92);
        // Dot: gentle breathe
        const dotS = 1 + Math.sin(m.t * 1.5) * 0.18;
        m.dot.scale.setScalar(dotS);
      });

      // Clouds drift
      if (clouds) clouds.rotation.y += 0.00055;

      // Aurora animation
      if (auroraMat) auroraMat.uniforms.time.value += 0.012;

      // ISS orbital animation
      issOrbit.angle += issOrbit.speed;
      {
        const issPos = new THREE.Vector3()
          .addScaledVector(issOrbit.u, Math.cos(issOrbit.angle) * issOrbit.r)
          .addScaledVector(issOrbit.v, Math.sin(issOrbit.angle) * issOrbit.r);
        iss.position.copy(issPos);
        iss.lookAt(new THREE.Vector3(0, 0, 0));
      }


      // Shooting stars
      if (Math.random() < 0.007) {
        const mat = new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.95 });
        const theta2 = Math.random() * Math.PI * 2, phi2 = Math.random() * Math.PI;
        const start = new THREE.Vector3(
          Math.sin(phi2) * Math.cos(theta2),
          Math.cos(phi2),
          Math.sin(phi2) * Math.sin(theta2)
        ).multiplyScalar(18 + Math.random() * 15);
        const vel = new THREE.Vector3(
          (Math.random() - 0.5),
          (Math.random() - 0.5) * 0.3,
          (Math.random() - 0.5)
        ).normalize().multiplyScalar(0.7);
        const geo = new THREE.BufferGeometry().setFromPoints([start.clone(), start.clone()]);
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        shootingStars.push({ line, mat, geo, pos: start.clone(), vel, age: 0, life: 40 + Math.random() * 25 });
      }
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        ss.age++;
        ss.pos.add(ss.vel);
        const tail = ss.pos.clone().sub(ss.vel.clone().multiplyScalar(6));
        const arr = ss.geo.attributes.position.array;
        tail.toArray(arr, 0); ss.pos.toArray(arr, 3);
        ss.geo.attributes.position.needsUpdate = true;
        ss.mat.opacity = Math.max(0, 0.95 * (1 - ss.age / ss.life));
        if (ss.age >= ss.life) { scene.remove(ss.line); shootingStars.splice(i, 1); }
      }

      // ── Parachutist animation ──
      if (parachuteState) {
        const ps = parachuteState;
        if (ps.phase === 'falling') {
          const t = Math.min((Date.now()-ps.startTime)/ps.duration, 1);
          const eased = 1-Math.pow(1-t, 2.2);
          ps.mesh.position.lerpVectors(ps.startPos, ps.endPos, eased);
          const outward = ps.mesh.position.clone().normalize();
          ps.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), outward);
          const sway = Math.sin(t*Math.PI*5)*0.12*(1-t);
          ps.mesh.rotateZ(sway*0.04);
          if (t>=1) {
            if (ps.type==='land') {
              ps.phase='landed';
              // Zoom in close now that parachutist has landed
              const tempV = ps.endPos.clone();
              globe.localToWorld(tempV);
              const landDir = tempV.normalize();
              zoomTween = { startPos: camera.position.clone(), endPos: landDir.multiplyScalar(2.5), t:0, dur:55 };
              setTimeout(()=>{ if(parachuteState===ps){globe.remove(ps.mesh);parachuteState=null;} },3500);
            } else {
              ps.phase='dying'; ps.deathStart=Date.now();
            }
          }
        } else if (ps.phase==='dying') {
          const t = Math.min((Date.now()-ps.deathStart)/600,1);
          const sunkPos = ps.endPos.clone().addScaledVector(ps.normal,-t*0.14);
          ps.mesh.position.copy(sunkPos);
          ps.mesh.scale.setScalar(3.5*(1-t*0.92));
          ps.mesh.rotateY(0.07);
          if (t>=1) {
            // Place dead body — starts tiny and scales up (smooth emerge)
            const db = makeDeadBody();
            db.scale.setScalar(0.01);
            db.position.copy(ps.endPos);
            db.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), ps.normal);
            globe.add(db);
            deadBodies.push({mesh:db, basePos:ps.endPos.clone(), normal:ps.normal.clone(), t:Math.random()*Math.PI*2, emerge:0});
            globe.remove(ps.mesh);
            parachuteState = null;
            zoomCamera(5.5, 55); controls.enabled=true; globeRotPaused=false;
          }
        }
        // ── PUBG follow-cam (ocean die) ──
        if (ps && ps.followCam && ps.phase === 'falling') {
          const paraWorldPos = new THREE.Vector3();
          ps.mesh.getWorldPosition(paraWorldPos);
          const outDir = paraWorldPos.clone().normalize();
          const worldUp = new THREE.Vector3(0, 1, 0);
          let sideDir = new THREE.Vector3().crossVectors(outDir, worldUp).normalize();
          if (sideDir.lengthSq() < 0.01) sideDir.set(1, 0, 0);
          const targetCamPos = paraWorldPos.clone()
            .addScaledVector(outDir, 1.0)
            .addScaledVector(sideDir, 1.1);
          // Snap on first frame so mobile doesn't start with parachutist off-screen
          if (!ps.camSnapped) {
            camera.position.copy(targetCamPos);
            ps.camSnapped = true;
          } else {
            camera.position.lerp(targetCamPos, 0.08);
          }
          camera.lookAt(paraWorldPos);
        }
      }

      // ── Dead body gentle bobbing + emerge scale-up ──
      deadBodies.forEach(db => {
        db.t += 0.016;
        // Smooth emerge: scale from 0 → 4.0 over ~1.2 seconds (easeOutBack)
        if (db.emerge < 1) {
          db.emerge = Math.min(1, db.emerge + 0.014);
          const e = db.emerge;
          // easeOutBack spring feel
          const c1 = 1.70158, c3 = c1 + 1;
          const eased = 1 + c3 * Math.pow(e-1,3) + c1 * Math.pow(e-1,2);
          db.mesh.scale.setScalar(Math.max(0, 4.0 * eased));
        }
        const bob = Math.sin(db.t*1.2)*0.003;
        db.mesh.position.copy(db.basePos.clone().addScaledVector(db.normal, bob));
        db.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), db.normal);
        const tiltAx = new THREE.Vector3(-db.normal.z,0,db.normal.x).normalize();
        db.mesh.rotateOnAxis(tiltAx, Math.sin(db.t*0.7)*0.06);
      });

      // ── 2D Weather overlay ──
      {
        const wc = document.getElementById('weatherCanvas');
        if (wc) {
          if (wc.width !== W() || wc.height !== H()) { wc.width = W(); wc.height = H(); }
          const wCtx = wc.getContext('2d');
          wCtx.clearRect(0, 0, wc.width, wc.height);
          if (weatherAnim) {
            const elapsed = Date.now() - weatherAnim.startTime;
            if (elapsed >= weatherAnim.duration) {
              stopWeather();
            } else {
              const fade = Math.min(1, (weatherAnim.duration - elapsed) / 600);
              const { particles } = weatherAnim;
              if (weatherAnim.type === 'money') {
                particles.forEach(p => {
                  p.x += p.vx + Math.sin(tick * 2.5 + p.phase) * p.swayAmp;
                  p.y += p.vy;
                  p.rot += p.rotSpeed;
                  if (p.y > wc.height + 60) { p.y = p.y_reset - Math.random()*200; p.x = Math.random()*wc.width; }
                  wCtx.save();
                  wCtx.globalAlpha = fade * 0.92;
                  wCtx.translate(p.x, p.y);
                  wCtx.rotate(p.rot);
                  wCtx.fillStyle = '#c8a020';
                  wCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                  wCtx.strokeStyle = '#a07010'; wCtx.lineWidth = 2;
                  wCtx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
                  wCtx.fillStyle = '#1a4a1a';
                  wCtx.font = `bold ${Math.round(p.h*0.75)}px sans-serif`;
                  wCtx.textAlign = 'center'; wCtx.textBaseline = 'middle';
                  wCtx.fillText('$', 0, 0);
                  wCtx.restore();
                });
              } else {
                particles.forEach(p => {
                  p.y += p.vy;
                  if (p.y > wc.height + 40) { p.y = p.y_reset - Math.random()*100; p.x = Math.random()*wc.width; }
                  wCtx.save();
                  wCtx.globalAlpha = fade * 0.75;
                  wCtx.strokeStyle = '#88BBFF'; wCtx.lineWidth = 1.5;
                  wCtx.beginPath(); wCtx.moveTo(p.x, p.y); wCtx.lineTo(p.x-1, p.y+p.len); wCtx.stroke();
                  wCtx.restore();
                });
              }
            }
          }
        }
      }

      // Skip controls.update() when PUBG follow-cam is active — it would override camera position
      if (!(parachuteState && parachuteState.followCam && parachuteState.phase === 'falling')) {
        controls.update();
      }
      renderer.render(scene, camera);
    }
    let calcBorderLine = null;
    let homeHighlight  = null;
    let flightArc      = null;
    let flightDot      = null;
    let flightArcPts   = [];
    let flightArcT     = 0;
    animate();

    // ═══════════════════════════════════════════
    //  COUNTRY CLICK — PRICE INFO
    // ═══════════════════════════════════════════

    // [latMin, latMax, lonMin, lonMax] — checked smallest-area first
    // MYR_RATE: 1 USD ≈ 4.47 MYR (2025 approx)
    const MYR_RATE = 4.47;
    const MY_GRAD_USD = 670; // Malaysia fresh grad baseline (USD)

    const COUNTRIES = [
      // Very small / precise first
      { name:'Singapore',    bb:[1.1,1.6,103.5,104.1], bigMac:5.00, logo:400, cur:'SGD — Singapore Dollar', grad:2580,  gradStr:'SGD 3,500' },
      { name:'UAE',          bb:[22,26,51,56],          bigMac:4.48, logo:300, cur:'AED — UAE Dirham',        grad:1362,  gradStr:'AED 5,000' },
      { name:'Netherlands',  bb:[51,53,3,7.5],          bigMac:5.20, logo:500, cur:'EUR — Euro',              grad:3000,  gradStr:'EUR 2,800' },
      { name:'Denmark',      bb:[54,58,8,16],           bigMac:5.10, logo:520, cur:'DKK — Danish Krone',      grad:4600,  gradStr:'DKK 32,000' },
      { name:'Switzerland',  bb:[45.8,47.8,5.9,10.6],  bigMac:8.17, logo:700, cur:'CHF — Swiss Franc',       grad:5700,  gradStr:'CHF 5,000' },
      { name:'South Korea',  bb:[34,38.5,126,130],      bigMac:4.10, logo:200, cur:'KRW — South Korean Won',  grad:1880,  gradStr:'KRW 2,500,000' },
      { name:'Japan',        bb:[30,46,130,146],        bigMac:3.70, logo:350, cur:'JPY — Japanese Yen',      grad:1450,  gradStr:'JPY 220,000' },
      { name:'New Zealand',  bb:[-47,-34,165,178],      bigMac:4.90, logo:400, cur:'NZD — New Zealand Dollar',grad:2130,  gradStr:'NZD 3,500' },
      { name:'United Kingdom',bb:[50,59,-8,2],          bigMac:4.86, logo:600, cur:'GBP — British Pound',     grad:3170,  gradStr:'GBP 2,500' },
      { name:'Ireland',      bb:[51,55,-10,-6],         bigMac:5.50, logo:550, cur:'EUR — Euro',              grad:3000,  gradStr:'EUR 2,800' },
      { name:'Portugal',     bb:[37,42,-9,-6],          bigMac:4.50, logo:350, cur:'EUR — Euro',              grad:1180,  gradStr:'EUR 1,100' },

      // Sort by area ascending → pick most specific match
      const matches = COUNTRIES.filter(c => {
        const [la,lb,loa,lob] = c.bb;
        return lat>=la && lat<=lb && lon>=loa && lon<=lob;
      });
      if (!matches.length) return null;
      return matches.reduce((best, c) => {
        const area = (c.bb[1]-c.bb[0])*(c.bb[3]-c.bb[2]);
        const bArea = (best.bb[1]-best.bb[0])*(best.bb[3]-best.bb[2]);
        return area < bArea ? c : best;
      });
    }

    function showHomeLandmark(country) {
      if (homeHighlight) {
        // Restore landmark building materials before disposing
        if (homeHighlight.userData.homeBldgMats) {
          homeHighlight.userData.homeBldgMats.forEach(({ child, orig, glow }) => {
            child.material = orig;
            glow.dispose();
          });
        }
        disposeObj(homeHighlight); globe.remove(homeHighlight); homeHighlight = null;
      }

      const lmName = COUNTRY_LANDMARK_MAP[country.name];
      let lmLat = (country.bb[0] + country.bb[1]) / 2;
      let lmLon = (country.bb[2] + country.bb[3]) / 2;
      if (lmName) {
        const lmDef = landmarks.find(l => l.name === lmName);
        if (lmDef) { lmLat = lmDef.lat; lmLon = lmDef.lon; }
      }

      const hGroup = new THREE.Group();
      // Use depthTest:true so globe naturally occludes markers on the back face
      const pos     = ll2v(lmLat, lmLon, R + 0.025); // well above surface
      const outward = pos.clone().normalize();
      const quat    = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), outward);

      function ringMesh(inner, outer, color, opacity) {
        const mat = new THREE.MeshBasicMaterial({
          color, transparent: true, opacity,
          side: THREE.DoubleSide, depthTest: true, depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        const mesh = new THREE.Mesh(new THREE.RingGeometry(inner, outer, 48), mat);
        mesh.position.copy(pos);
        mesh.quaternion.copy(quat);
        mesh.renderOrder = 5;
        return { mesh, mat };
      }

      // Centre bright dot
      const dotMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, depthTest: true, depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.020, 16, 10), dotMat);
      dot.position.copy(pos); dot.renderOrder = 5;
      hGroup.add(dot);

      // 3 concentric pulsing rings
      const r1 = ringMesh(0.030, 0.052, 0xffee00, 1.0); hGroup.add(r1.mesh);
      const r2 = ringMesh(0.060, 0.090, 0xffaa00, 0.7); hGroup.add(r2.mesh);
      const r3 = ringMesh(0.105, 0.160, 0xff6600, 0.4); hGroup.add(r3.mesh);

      // Upward beam (line segments radiating outward)
      const beamPts = [];
      for (let i = 0; i <= 24; i++) beamPts.push(ll2v(lmLat, lmLon, R + 0.02 + i * 0.045));
      const beamMat = new THREE.LineBasicMaterial({
        color: 0xffff88, transparent: true, opacity: 0.7,
        depthTest: true, depthWrite: false, blending: THREE.AdditiveBlending
      });
      const beam = new THREE.Line(new THREE.BufferGeometry().setFromPoints(beamPts), beamMat);
      beam.renderOrder = 5;
      hGroup.add(beam);

      // Glow the landmark building itself if one exists for this country
      let homeBldgMats = null;
      if (lmName) {
        const lmEntry = landmarkData.find(d => d.name === lmName);
        if (lmEntry) {
          homeBldgMats = [];
          lmEntry.bldg.traverse(child => {
            if (child.isMesh && child.material && !Array.isArray(child.material)) {
              const orig = child.material;
              const glow = orig.clone();
              glow.emissive = new THREE.Color(0xffbb44);
              glow.emissiveIntensity = 1.2;
              child.material = glow;
              homeBldgMats.push({ child, orig, glow });
            }
          });
        }
      }

      hGroup.userData = { dotMat, r1: r1.mat, r2: r2.mat, r3: r3.mat, beamMat, ring3mesh: r3.mesh, homeBldgMats };
      globe.add(hGroup);
      homeHighlight = hGroup;

      controls.enabled = false;
      globeRotPaused = true;
      countryOverlay.style.display = 'none'; // hide client overlay when home changes
      spinGlobeToCountry(lmLat, lmLon);
      const theta_hl = (lmLon + 180) * Math.PI / 180;
      const rotMat_hl = new THREE.Matrix4().makeRotationFromEuler(
        new THREE.Euler(0, Math.PI / 2 - theta_hl, 0.41, 'XYZ')
      );
      const endPos = ll2v(lmLat, lmLon, 1.0).applyMatrix4(rotMat_hl).normalize().multiplyScalar(3.5);
      zoomTween = { startPos: camera.position.clone(), endPos, t: 0, dur: 70 };
    }

    // Build a ✈ sprite texture once
    const _planeCanvas = document.createElement('canvas');
    _planeCanvas.width = 128; _planeCanvas.height = 128;
    { const c = _planeCanvas.getContext('2d');
      c.clearRect(0,0,128,128);
      c.font = '96px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';

    function drawFlightArc(homeCountry, clientCountry) {
      // Fully remove previous arc + plane
      if (flightArc) { disposeObj(flightArc); globe.remove(flightArc); flightArc = null; }
      if (flightDot) { flightDot.material.dispose(); globe.remove(flightDot); flightDot = null; }
      flightArcPts = [];

      const latA = (homeCountry.bb[0]   + homeCountry.bb[1])   / 2;
      const lonA = (homeCountry.bb[2]   + homeCountry.bb[3])   / 2;
      const latB = (clientCountry.bb[0] + clientCountry.bb[1]) / 2;
      const lonB = (clientCountry.bb[2] + clientCountry.bb[3]) / 2;

      const STEPS = 120;
      const vA = ll2v(latA, lonA, R).normalize();
      const vB = ll2v(latB, lonB, R).normalize();
      for (let i = 0; i <= STEPS; i++) {
        const t = i / STEPS;
        const v = new THREE.Vector3().lerpVectors(vA, vB, t).normalize();
        flightArcPts.push(v.clone().multiplyScalar(R + 0.07 + 0.30 * Math.sin(Math.PI * t)));
      }

      // Single clean arc line (no glow duplicate)
      const arcGroup = new THREE.Group();
      const arcGeo = new THREE.BufferGeometry().setFromPoints(flightArcPts);

      const arcLine = new THREE.Line(arcGeo, new THREE.LineBasicMaterial({
        color: 0x88ccff, transparent: true, opacity: 0.7,
        depthTest: true, depthWrite: false, blending: THREE.AdditiveBlending
      }));
      arcLine.renderOrder = 4;
      arcGroup.add(arcLine);

      globe.add(arcGroup);
      flightArc = arcGroup;

      // Plane sprite — always visible, faces camera
      const spriteMat = new THREE.SpriteMaterial({
        map: _planeTex, transparent: true, opacity: 1.0,
        depthTest: false, depthWrite: false, sizeAttenuation: true
      });
      flightDot = new THREE.Sprite(spriteMat);

      flightDot.position.copy(flightArcPts[0]);

    // Country highlight on globe — filled overlay + outline
    function showCountryBorder(country) {
      // Remove previous
      if (calcBorderLine) { globe.remove(calcBorderLine); calcBorderLine = null; }

      const [latS, latN, lonW, lonE] = country.bb;
      const SEG = 48;
      const overlayR = R + 0.003;
      const lineR    = R + 0.006;
      const group = new THREE.Group();

      // ── Filled overlay mesh ──────────────────
      const positions = [];
      const indices   = [];
      for (let row = 0; row <= SEG; row++) {
        const lat = latS + (latN - latS) * row / SEG;
        for (let col = 0; col <= SEG; col++) {
          const lon = lonW + (lonE - lonW) * col / SEG;
          const v = ll2v(lat, lon, overlayR);
          positions.push(v.x, v.y, v.z);
        }
      }
      for (let row = 0; row < SEG; row++) {
        for (let col = 0; col < SEG; col++) {
          const a = row * (SEG + 1) + col;
          const b = a + 1;
          const c = a + (SEG + 1);
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }
      const fillGeo = new THREE.BufferGeometry();
      fillGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      fillGeo.setIndex(indices);
      const fillMat = new THREE.MeshBasicMaterial({
        color: 0x44aaff, transparent: true, opacity: 0.18,
        side: THREE.DoubleSide, depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      group.add(new THREE.Mesh(fillGeo, fillMat));

      // ── Outline border ───────────────────────
      const edgePts = [];
      for (let i = 0; i <= SEG; i++) edgePts.push(ll2v(latS, lonW + (lonE - lonW) * i / SEG, lineR)); // S
      for (let i = 0; i <= SEG; i++) edgePts.push(ll2v(latS + (latN - latS) * i / SEG, lonE, lineR)); // E
      for (let i = 0; i <= SEG; i++) edgePts.push(ll2v(latN, lonE - (lonE - lonW) * i / SEG, lineR)); // N
      for (let i = 0; i <= SEG; i++) edgePts.push(ll2v(latN - (latN - latS) * i / SEG, lonW, lineR)); // W
      const lineGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x00eeff, transparent: true, opacity: 1.0, depthWrite: false, blending: THREE.AdditiveBlending });
      group.add(new THREE.LineLoop(lineGeo, lineMat));

      // ── Glow border (wider, dimmer) ──────────
      const glowMat = new THREE.LineBasicMaterial({ color: 0x0066ff, transparent: true, opacity: 0.4, depthWrite: false, blending: THREE.AdditiveBlending });
      const glowGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
      group.add(new THREE.LineLoop(glowGeo, glowMat));

      // Store refs for pulse animation
      group.userData.lineMat  = lineMat;
      group.userData.glowMat  = glowMat;
      group.userData.fillMat  = fillMat;

      globe.add(group);
      calcBorderLine = group;

      // Full transform: M = Ry(PI/2-theta) * Rz(0.41), applied to ll2v(lat,lon,1).
      // Using Matrix4 avoids the simplified formula that only works near lon≈-90.
      const theta   = (lon + 180) * Math.PI / 180;
      const targetRY = Math.PI / 2 - theta;
      const pLocal  = ll2v(lat, lon, 1.0);
      const rotMat  = new THREE.Matrix4().makeRotationFromEuler(

    // ── Raycasting click handler ───────────────
    const raycaster = new THREE.Raycaster();
    const _mouse = new THREE.Vector2();
    let _mouseDownX = 0, _mouseDownY = 0;

    // Cursor: pointer over earth or marker dots
    renderer.domElement.addEventListener('mousemove', e => {
      const rect = renderer.domElement.getBoundingClientRect();
      _mouse.x = ((e.clientX - rect.left) / rect.width)  *  2 - 1;

      // Landmark hover — hemisphere check + 2D proximity to avoid glancing-angle false positives
      const lmHits = raycaster.intersectObjects(landmarkData.map(d => d.bldg), true);
      if (lmHits.length) {
        let rootObj = lmHits[0].object;
        while (rootObj && rootObj.parent !== lmGroup) rootObj = rootObj.parent;
        if (rootObj && rootObj.userData.lmIdx !== undefined) {
          const lmWorldPos = new THREE.Vector3();
          rootObj.getWorldPosition(lmWorldPos);
          // 1) Hemisphere: landmark must face the camera
          const surfaceNormal = lmWorldPos.clone().normalize();
          const toCamera = camera.position.clone().normalize();
          if (surfaceNormal.dot(toCamera) > 0.2) {
            // 2) Screen-space proximity: mouse must be within 70px of landmark's projected position
            const projPos = lmWorldPos.clone().project(camera);
            const sw = renderer.domElement.clientWidth;
            const sh = renderer.domElement.clientHeight;
            const screenX = (projPos.x * 0.5 + 0.5) * sw;
            const screenY = (0.5 - projPos.y * 0.5) * sh;
            const screenDist = Math.hypot(e.clientX - screenX, e.clientY - screenY);

              tooltip.style.top  = (e.clientY - 8)  + 'px';
              renderer.domElement.style.cursor = 'pointer';
              return;
            }
          }
        }
      }

      const dots = markerData.map(m => m.dot);
      const dotHit = raycaster.intersectObjects(dots, false);
      if (dotHit.length) {
        const idx = dots.indexOf(dotHit[0].object);
        tooltip.textContent = markerData[idx].country.name;
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top  = (e.clientY - 8)  + 'px';
        renderer.domElement.style.cursor = 'pointer';

        const earthHit = raycaster.intersectObject(earth, false);

          // Show country name tooltip when hovering earth
          const lp2 = globe.worldToLocal(earthHit[0].point.clone());
          const len2 = lp2.length();
          const lat2 = 90 - Math.acos(Math.max(-1,Math.min(1,lp2.y/len2)))*180/Math.PI;
          let lon2 = Math.atan2(lp2.z,-lp2.x)*180/Math.PI-180;
          if (lon2 < -180) lon2 += 360;
          const hc = detectCountry(lat2, lon2);
          if (hc) {
            tooltip.textContent = '🪂 ' + hc.name;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX+16)+'px';
            tooltip.style.top  = (e.clientY-8)+'px';

          tooltip.style.display = 'none';
          renderer.domElement.style.cursor = 'default';
        }
      }
    });

    renderer.domElement.addEventListener('mousedown', e => {
      _mouseDownX = e.clientX; _mouseDownY = e.clientY;
    });
    renderer.domElement.addEventListener('mouseup', e => {
      const dx = e.clientX - _mouseDownX, dy = e.clientY - _mouseDownY;
      if (Math.sqrt(dx*dx+dy*dy) > 6) return; // drag, not click

      const rect = renderer.domElement.getBoundingClientRect();
      _mouse.x = ((e.clientX - rect.left) / rect.width)  *  2 - 1;
      _mouse.y = -((e.clientY - rect.top)  / rect.height) *  2 + 1;
      raycaster.setFromCamera(_mouse, camera);

      // Hit test: dots → earth (both work, dots just give exact country center)
      let clickLat, clickLon;
      const dots = markerData.map(m => m.dot);
      const dotHits = raycaster.intersectObjects(dots, false);
      if (dotHits.length) {
        const country = markerData[dots.indexOf(dotHits[0].object)].country;
        clickLat = (country.bb[0]+country.bb[1])/2;
        clickLon = (country.bb[2]+country.bb[3])/2;
      } else {
        const hits = raycaster.intersectObject(earth, false);
        if (!hits.length) { if (panel.style.display!=='none') closePanel(); return; }
        const lp = globe.worldToLocal(hits[0].point.clone());
        const len = lp.length();
        clickLat = 90 - Math.acos(Math.max(-1,Math.min(1,lp.y/len)))*180/Math.PI;
        clickLon = Math.atan2(lp.z,-lp.x)*180/Math.PI-180;
        if (clickLon < -180) clickLon += 360;
      }

      const country = detectCountry(clickLat, clickLon);
      if (country) {
        // Snap to country center for clean parachute landing
        const cLat = (country.bb[0]+country.bb[1])/2;
        const cLon = (country.bb[2]+country.bb[3])/2;
        showPanel(country);
        // Delay launch until globe spin (~65 frames @ 60fps ≈ 1100ms) is mostly done
        setTimeout(() => launchParachutist(cLat, cLon, 'land'), 950);
      } else {
        // Check if this is actual ocean or uncovered land (grass with no country data)
        let isActualOcean = true;
        if (earthCanvas && !dotHits.length) {
          const hits2 = raycaster.intersectObject(earth, false);
          if (hits2.length && hits2[0].uv) {
            const u = hits2[0].uv.x, v = hits2[0].uv.y;
            const px2 = Math.floor(u * earthCanvas.width);
            const py2 = Math.floor((1-v) * earthCanvas.height);
            const d = earthCanvas.getContext('2d').getImageData(Math.max(0,Math.min(earthCanvas.width-1,px2)), Math.max(0,Math.min(earthCanvas.height-1,py2)), 1, 1).data;
            // Ocean: blue dominates; Land: green dominates
            if (d[1] > d[2]) isActualOcean = false; // green > blue → land
          }
        }
        if (!isActualOcean) {
          showToast('🌿 No data for this region', 'rgba(40,110,40,0.92)');
          return;
        }
        // True ocean — spin + zoom, parachutist falls, dead body appears
        launchParachutist(clickLat, clickLon, 'die');
        globeRotPaused = true;
        controls.enabled = false;
        if (panel.style.display!=='none') closePanel();
        spinGlobeToCountry(clickLat, clickLon);
        // PUBG-style: camera follows the parachutist dynamically (handled in animate loop)
        if (parachuteState) parachuteState.followCam = true;
      }
    });

    // Dev version badge — localhost only, hidden in production
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      const devBadge = document.createElement('div');
      devBadge.style.cssText = `
        position:fixed; bottom:8px; left:8px; z-index:9999;
        background:rgba(255,200,0,0.92); color:#1a1000;
        font:bold 11px monospace; padding:3px 10px; border-radius:5px;
        pointer-events:none; user-select:none;
        box-shadow:0 2px 8px rgba(0,0,0,0.4);
      `;
      devBadge.textContent = '🔧 DEV · ' + new Date(document.lastModified).toLocaleTimeString();
      document.body.appendChild(devBadge);
    }

    function onResize() {
      const w = W(), h = H();
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('load', onResize);
    setTimeout(onResize, 100);
    } catch(err) {
      console.error('EARTH ERROR:', err.message, err.stack);
    }
  </script>
</body>
</html>
